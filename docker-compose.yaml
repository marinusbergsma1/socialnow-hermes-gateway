services:
  queue-init:
    image: alpine:3.22
    restart: "no"
    command: ["/bin/sh", "-c", "mkdir -p /queue/outbox /queue/replay /queue/delivered /queue/repo && chown -R 1000:1000 /queue/outbox /queue/replay"]
    volumes: ["hermes_queue:/queue"]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["CHOWN"]

  provisioner:
    image: node:22-alpine
    restart: unless-stopped
    depends_on:
      queue-init: { condition: service_completed_successfully }
    user: node
    command:
      - /bin/sh
      - -ec
      - |
        mkdir -p /tmp/app
        cd /tmp/app
        wget -qO server.mjs https://raw.githubusercontent.com/marinusbergsma1/socialnow-hermes-gateway/22e8faaec4e793ba4fa93c1e11956e3976d14b61/src/server.mjs
        wget -qO core.mjs https://raw.githubusercontent.com/marinusbergsma1/socialnow-hermes-gateway/22e8faaec4e793ba4fa93c1e11956e3976d14b61/src/core.mjs
        wget -qO oidc.mjs https://raw.githubusercontent.com/marinusbergsma1/socialnow-hermes-gateway/22e8faaec4e793ba4fa93c1e11956e3976d14b61/src/oidc.mjs
        wget -qO file-queue.mjs https://raw.githubusercontent.com/marinusbergsma1/socialnow-hermes-gateway/22e8faaec4e793ba4fa93c1e11956e3976d14b61/src/file-queue.mjs
        wget -qO queue.mjs https://raw.githubusercontent.com/marinusbergsma1/socialnow-hermes-gateway/22e8faaec4e793ba4fa93c1e11956e3976d14b61/src/queue.mjs
        printf '0be9f2169725aeb4ef754e8cb61f0f4487099f4899a01bff7b94026ea15ba6d4  server.mjs\n220581ed0b12dd83716b861a54f73794a3519b1f8a3afa8faee1cc76c3a6a641  core.mjs\n33e785f009f60c312e19c2e441e7374a4e00171ce2f4b2003aa2643dc9e38f8f  oidc.mjs\n564a5c147f475324129f5153ba1e23a58c2a7850a5138a00e978724973e76b1a  file-queue.mjs\n2dcebd45e4a73e9ea11c0ca35dc049f90e1a0651a4a0b9fc02a352928e51479a  queue.mjs\n' | sha256sum -c -
        exec node server.mjs
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATA_DIR: /data
      QUEUE_MODE: file
      VERCEL_OIDC_ISSUER: ${VERCEL_OIDC_ISSUER}
      VERCEL_OIDC_AUDIENCE: ${VERCEL_OIDC_AUDIENCE}
      VERCEL_OIDC_SUBJECT: ${VERCEL_OIDC_SUBJECT}
      VERCEL_PROJECT_ID: ${VERCEL_PROJECT_ID}
      VERCEL_OWNER_ID: ${VERCEL_OWNER_ID}
      QUEUE_ENCRYPTION_KEY: ${QUEUE_ENCRYPTION_KEY}
    volumes: ["hermes_queue:/data"]
    read_only: true
    tmpfs: ["/tmp:size=32m,noexec,nosuid"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 80
    mem_limit: 192m
    cpus: 0.50
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  queue-pusher:
    image: alpine/git:latest
    restart: unless-stopped
    depends_on:
      queue-init: { condition: service_completed_successfully }
    entrypoint:
      - /bin/sh
      - -ec
      - |
        wget -qO /tmp/queue-pusher.sh https://raw.githubusercontent.com/marinusbergsma1/socialnow-hermes-gateway/22e8faaec4e793ba4fa93c1e11956e3976d14b61/deploy/queue-pusher.sh
        echo '74be6cce1fd56bf425696166ecb5002014b8e7d8862621d5a7a96ceb75f5b760  /tmp/queue-pusher.sh' | sha256sum -c -
        exec /bin/sh /tmp/queue-pusher.sh
    environment:
      QUEUE_GIT_REPOSITORY: ${QUEUE_GIT_REPOSITORY}
      QUEUE_SSH_PRIVATE_KEY_B64: ${QUEUE_SSH_PRIVATE_KEY_B64}
    volumes: ["hermes_queue:/queue"]
    read_only: true
    tmpfs: ["/tmp:size=16m,noexec,nosuid"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 80
    mem_limit: 128m
    cpus: 0.25

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      provisioner: { condition: service_healthy }
    command: ["caddy", "reverse-proxy", "--from", "hermes.socialnow.nl", "--to", "provisioner:3000"]
    environment:
      GODEBUG: netdns=cgo
    ports: ["80:80", "443:443"]
    volumes: ["caddy_data:/data", "caddy_config:/config"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    pids_limit: 100
    mem_limit: 256m
    cpus: 0.50

volumes:
  hermes_queue:
  caddy_data:
  caddy_config:
